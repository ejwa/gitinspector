[DEFAULT]
Suite: testing
Section: devel
Maintainer: Ejwa Hosting AB <gitinspector@ejwa.se>

# gitinspector is a program rather than a library, so the package is named after the program in both
# flavours. The two are alternatives and are never installed side by side; the Python 2 one carries a
# ~python2 revision so that it sorts below the Python 3 one.
Package: gitinspector
Package3: gitinspector
Depends: git (>= 1.7)
Depends3: git (>= 1.7)
XS-Python-Version: >= 2.7
X-Python3-Version: >= 3.5
